services:
  - type: web
    name: basp-api
    runtime: node
    rootDir: BASP/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_NAME
        value: BASP Admin
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_CREATE_DATABASE
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
