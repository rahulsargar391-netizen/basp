services:
  - type: web
    name: basp-api
    runtime: node
    rootDir: BASP/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_CREATE_DATABASE
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_FILE
        sync: false
